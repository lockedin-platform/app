; Production OPcache tuning for LockedIn.
; CRITICAL: the app is served via `php -S` (CLI SAPI), where OPcache is OFF by default.
; Without enable_cli=1, PHP recompiles every file on every request -> slow.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; code doesn't change between deploys -> skip per-request file stat() for speed
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.fast_shutdown=1
realpath_cache_size=4096K
realpath_cache_ttl=600
